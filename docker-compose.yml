services:
  nginx:
    container_name: web-nginx
    image: nginx:latest # Using the default Nginx image with custom configuration.
    volumes:
      # Mount the application code for live updates
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Map port 80 inside the container to the port specified by 'NGINX_PORT' on the host machine
      - "80:80"
    environment:
      - NGINX_HOST=localhost
    networks:
      - web-network
    depends_on:
      octane:
        condition: service_started
      reverb:
        condition: service_started

  workspace:
    container_name: workspace
    build:
      # Set context to root directory
      context: .
      dockerfile: ./docker/workspace/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        XDEBUG_MODE: off
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: /dev/stdout
        XDEBUG_LOG_LEVEL: 0
    tty: true # Enables an interactive terminal
    stdin_open: true # Keeps standard input open for 'docker exec'
    volumes:
      - ./:/var/www
    networks:
      - web-network
    depends_on:
      postgres:
        condition: service_started

  octane:
    container_name: octane-server
    build:
      context: .
      dockerfile: ./docker/octane/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-false}
        XDEBUG_MODE: develop,coverage,debug,profile
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: /dev/stdout
        XDEBUG_LOG_LEVEL: 0
    user: "${UID:-1000}:${GID:-1000}"
    tty: true # Enables an interactive terminal
    stdin_open: true # Keeps standard input open for 'docker exec'
    volumes:
      # Mount the application code for live updates
      - ./:/var/www
    ports:
      - "8000:8000"
    networks:
      - web-network
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started

  reverb:
    container_name: reverb-server
    build:
      context: .
      dockerfile: ./docker/octane/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-false}
        XDEBUG_MODE: develop,coverage,debug,profile
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: /dev/stdout
        XDEBUG_LOG_LEVEL: 0
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    user: "${UID:-1000}:${GID:-1000}"
    tty: true
    stdin_open: true
    volumes:
      - ./:/var/www
    networks:
      - web-network
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started

  postgres:
    build:
      context: .
      dockerfile: ./docker/postgres/Dockerfile
    container_name: postgres-db
    environment:
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    networks:
      - web-network
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

  redis:
    container_name: redis
    build:
        context: .
        dockerfile: ./docker/redis/Dockerfile
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
      REDIS_DEFAULT_PASSWORD: ${REDIS_DEFAULT_PASSWORD:-secret}
    ports:
        - "6379:6379"
    networks:
        - web-network
    volumes:
        - redis-data:/data

networks:
  web-network:
      driver: bridge
      name: web-network
      ipam:
        config:
          - subnet: 172.21.0.0/24
            ip_range: 172.21.0.0/24

volumes:
  pgdata:
  redis-data:

