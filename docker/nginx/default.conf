map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Upstream block resolves DNS at nginx startup using /etc/resolv.conf (Docker's automatic DNS).
# This avoids needing an explicit 'resolver 127.0.0.11' directive, which would be required
# if we used variables directly in proxy_pass (e.g., proxy_pass http://$backend).
# With upstream, nginx resolves 'octane-server' to its container IP at configuration load time,
# eliminating the need to hardcode Docker's internal DNS address.
upstream app_container {
    server octane-server:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    server_tokens off;
    root /var/www/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    location /index.php {
        try_files /not_exists @octane;
    }

    location / {
        try_files $uri $uri/ @octane;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
 
    access_log off;
    error_log  /var/log/nginx/octane-server-error.log error;
 
    error_page 404 /index.php;

    location @octane {
        set $suffix "";
 
        if ($uri = /index.php) {
            set $suffix ?$query_string;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_pass http://app_container$suffix;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
